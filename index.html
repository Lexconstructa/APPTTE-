<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexConstructa | Simulación Profesional en Arquitectura y Derecho</title>
  
  <!-- Tipografía moderna Inter y JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0f172a',
              blue: '#1d4ed8',
              accent: '#f97316',
              darkblue: '#1e3a8a',
              orangeDark: '#c2410c'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            serif: ['Merriweather', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Estilos complementarios -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="h-full flex flex-col font-sans bg-slate-950 text-slate-100 selection:bg-orange-500 selection:text-white">

  <!-- =========================================================================
       BARRA SUPERIOR GLOBAL: Identidad, Master Clock, Barra de Progreso y Acciones
       ========================================================================= -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-lg">
    <div class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Botón móvil y Logotipo -->
      <div class="flex items-center gap-3">
        <button id="btn-toggle-sidebar" class="lg:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none" aria-label="Abrir Menú">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>

        <div class="flex items-center gap-3 cursor-pointer" onclick="navigateSection('inicio')">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-700 via-blue-900 to-slate-900 border border-blue-500/40 flex items-center justify-center shadow-md">
            <!-- Icono Arquitectura + Balanza Legal -->
            <svg class="w-5 h-5 text-orange-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 21h18M5 21V7l7-4 7 4v14M9 10h1M9 14h1M9 18h1M14 10h1M14 14h1M14 18h1"></path>
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-extrabold tracking-tight text-white text-lg">LEX<span class="text-orange-500">CONSTRUCTA</span></span>
              <span class="hidden sm:inline-block text-[10px] font-semibold tracking-wider uppercase px-2 py-0.5 rounded bg-blue-900/60 text-blue-300 border border-blue-700/50">Cátedra Univ.</span>
            </div>
            <p class="hidden md:block text-xs text-slate-400">Simulación Interdisciplinaria: Arquitectura, CCCN y Mediación</p>
          </div>
        </div>
      </div>

      <!-- CRONÓMETRO DESTACADO DE SIMULACIÓN (Master Clock 180 min) -->
      <div class="flex items-center gap-2 sm:gap-4 bg-slate-950/80 px-3 sm:px-4 py-1.5 rounded-xl border border-slate-700/60 shadow-inner">
        <div class="flex items-center gap-2">
          <span class="relative flex h-3 w-3">
            <span id="timer-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
            <span id="timer-dot" class="relative inline-flex rounded-full h-3 w-3 bg-orange-500"></span>
          </span>
          <div class="hidden sm:block text-right">
            <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Master Clock</div>
            <div id="label-fase-actual" class="text-xs font-semibold text-blue-400">Fase 1: Apertura</div>
          </div>
        </div>

        <!-- Display Digital del Tiempo -->
        <div class="flex items-center gap-1">
          <div id="clock-display" class="font-mono text-xl sm:text-2xl font-black tracking-widest text-orange-400 drop-shadow">
            00:00
          </div>
          <span class="text-[10px] font-mono text-slate-500">/ 180m</span>
        </div>

        <!-- Controles Rápidos del Cronómetro -->
        <div class="flex items-center gap-1 border-l border-slate-800 pl-2">
          <button id="btn-timer-play" onclick="toggleTimer()" title="Iniciar / Pausar Cronómetro" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white transition">
            <svg id="icon-play-state" class="w-4 h-4 text-emerald-400" fill="currentColor" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>
          <button onclick="speedUpTimer()" title="Acelerar Simulación (1x, 5x, 15x)" class="px-2 py-1 text-[11px] font-mono font-bold rounded bg-slate-800 text-slate-300 hover:text-orange-400 transition">
            <span id="speed-indicator">1x</span>
          </button>
        </div>
      </div>

      <!-- Selector de Modo (Docente / Alumno) & Notificaciones -->
      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center bg-slate-800 p-1 rounded-lg border border-slate-700 text-xs">
          <button id="btn-mode-student" onclick="setUserMode('alumno')" class="px-3 py-1 rounded font-medium transition bg-blue-600 text-white shadow-sm">
            Alumno
          </button>
          <button id="btn-mode-teacher" onclick="setUserMode('docente')" class="px-3 py-1 rounded font-medium transition text-slate-300 hover:text-white">
            Docente
          </button>
        </div>

        <!-- Botón de Crisis Activa en alerta -->
        <button onclick="navigateSection('crisis')" title="Cartas de Crisis en curso" class="relative p-2 rounded-lg bg-orange-950/40 border border-orange-500/40 text-orange-400 hover:bg-orange-900/50 transition">
          <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
          <span id="badge-crisis-count" class="absolute -top-1 -right-1 w-4 h-4 bg-orange-500 text-slate-950 text-[10px] font-black rounded-full flex items-center justify-center">1</span>
        </button>
      </div>

    </div>

    <!-- Barra de progreso general de la clase (0% a 100%) -->
    <div class="w-full bg-slate-800 h-1.5 relative overflow-hidden">
      <div id="class-progress-bar" class="h-full bg-gradient-to-r from-blue-600 via-orange-500 to-amber-400 transition-all duration-300 w-0"></div>
    </div>
  </header>

  <!-- =========================================================================
       CUERPO PRINCIPAL: SIDEBAR + VISTA DE CONTENIDOS
       ========================================================================= -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- BACKDROP MÓVIL PARA SIDEBAR -->
    <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="hidden fixed inset-0 z-20 bg-slate-950/70 backdrop-blur-sm lg:hidden transition-opacity"></div>

    <!-- MENÚ LATERAL DE NAVEGACIÓN -->
    <aside id="app-sidebar" class="fixed lg:static inset-y-0 left-0 z-30 w-72 bg-slate-900/95 lg:bg-slate-900 border-r border-slate-800 flex flex-col justify-between transition-transform duration-300 -translate-x-full lg:translate-x-0">
      
      <!-- Lista de las 10 Secciones Principales -->
      <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        
        <div class="px-3 pb-2 pt-1 text-[11px] font-bold uppercase tracking-wider text-slate-400">
          Navegación del Taller
        </div>

        <nav class="space-y-1" id="nav-menu-list">
          <!-- 1. Inicio / Presentación -->
          <button onclick="navigateSection('inicio')" data-nav="inicio" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-left text-white bg-blue-900/40 border-l-4 border-orange-500">
            <svg class="w-5 h-5 text-orange-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span>1. Inicio & Desafío</span>
          </button>

          <!-- 2. Panel docente -->
          <button onclick="navigateSection('panel-docente')" data-nav="panel-docente" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-left text-slate-300 hover:text-white hover:bg-slate-800">
            <svg class="w-5 h-5 text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            <div class="flex-1 flex items-center justify-between">
              <span>2. Panel Docente</span>
              <span class="text-[9px] bg-blue-950 text-blue-300 px-1.5 py-0.5 rounded border border-blue-700/40">Cátedra</span>
            </div>
          </button>

          <!-- 3. Caso y antecedentes -->
          <button onclick="navigateSection('caso')" data-nav="caso" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-left text-slate-300 hover:text-white hover:bg-slate-800">
            <svg class="w-5 h-5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
            <span>3. Caso & Antecedentes</span>
          </button>

          <!-- 4. Organización de grupos y roles -->
          <button onclick="navigateSection('grupos')" data-nav="grupos" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-left text-slate-300 hover:text-white hover:bg-slate-800">
            <svg class="w-5 h-5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            <span>4. Grupos & Roles</span>
          </button>

          <!-- 5. Centro de agentes inteligentes -->
          <button onclick="navigateSection('agentes')" data-nav="agentes" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-left text-slate-300 hover:text-white hover:bg-slate-800">
            <svg class="w-5 h-5 text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            <div class="flex-1 flex items-center justify-between">
              <span>5. Agentes de IA</span>
              <span class="text-[9px] bg-orange-950 text-orange-400 px-1.5 py-0.5 rounded border border-orange-500/40">3 Agentes</span>
            </div>
          </button>

          <!-- 6. Documentación profesional -->
          <button onclick="navigateSection('documentacion')" data-nav="documentacion" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-left text-slate-300 hover:text-white hover:bg-slate-800">
            <svg class="w-5 h-5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span>6. Documentación</span>
          </button>

          <!-- 7. Sala de mediación -->
          <button onclick="navigateSection('mediacion')" data-nav="mediacion" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-left text-slate-300 hover:text-white hover:bg-slate-800">
            <svg class="w-5 h-5 text-orange-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>
            <div class="flex-1 flex items-center justify-between">
              <span>7. Sala de Mediación</span>
              <span class="text-[9px] bg-red-950 text-red-400 px-1.5 py-0.5 rounded border border-red-500/40">ZOPA</span>
            </div>
          </button>

          <!-- 8. Cartas de crisis -->
          <button onclick="navigateSection('crisis')" data-nav="crisis" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-left text-slate-300 hover:text-white hover:bg-slate-800">
            <svg class="w-5 h-5 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <div class="flex-1 flex items-center justify-between">
              <span>8. Cartas de Crisis</span>
              <span class="text-[9px] bg-orange-600/30 text-orange-300 px-1.5 py-0.5 rounded font-bold">Activo</span>
            </div>
          </button>

          <!-- 9. Evaluación y puntuación -->
          <button onclick="navigateSection('evaluacion')" data-nav="evaluacion" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-left text-slate-300 hover:text-white hover:bg-slate-800">
            <svg class="w-5 h-5 text-emerald-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            <span>9. Evaluación & Rúbrica</span>
          </button>

          <!-- 10. Cierre y reflexión -->
          <button onclick="navigateSection('cierre')" data-nav="cierre" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-left text-slate-300 hover:text-white hover:bg-slate-800">
            <svg class="w-5 h-5 text-blue-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span>10. Cierre & Reflexión</span>
          </button>
        </nav>

        <!-- PANEL DE ESTADO DINÁMICO DE SIMULACIÓN -->
        <div class="mt-6 pt-4 border-t border-slate-800">
          <div class="bg-slate-950/60 p-3 rounded-lg border border-slate-800 text-xs space-y-2">
            <div class="flex items-center justify-between text-slate-400">
              <span>Taxímetro de Obra:</span>
              <span id="sidebar-taximetro" class="font-mono text-orange-400 font-bold">$0</span>
            </div>
            <div class="flex items-center justify-between text-slate-400">
              <span>Tensión Negocial:</span>
              <span id="sidebar-tension" class="font-bold text-amber-400">55% (Media)</span>
            </div>
            <div class="flex items-center justify-between text-slate-400">
              <span>Equipos Activos:</span>
              <span class="text-white font-medium">4 (20 estudiantes)</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Footer del Sidebar con info de cátedra -->
      <div class="p-3 border-t border-slate-800 text-[11px] text-slate-400 bg-slate-950/40">
        <div class="flex items-center justify-between">
          <span>Práctica Profesional</span>
          <span class="font-mono text-slate-400">v2.4 - Univ</span>
        </div>
      </div>
    </aside>

    <!-- =========================================================================
         ÁREA PRINCIPAL DE CONTENIDO DINÁMICO (Las 10 Secciones)
         ========================================================================= -->
    <main id="main-content" class="flex-1 overflow-y-auto bg-slate-950 p-4 sm:p-6 lg:p-8">
      
      <!-- CONTENEDOR DINÁMICO QUE RENDERIZA CADA SECCIÓN -->
      <div id="section-container" class="max-w-7xl mx-auto space-y-6">
        <!-- Renderizado vía app.js -->
      </div>

    </main>

  </div>

  <!-- Modal para Visualización Detallada o Interacción con Agentes -->
  <div id="app-modal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-2xl w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-white">Detalle</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white">&times;</button>
      </div>
      <div id="modal-body" class="text-sm text-slate-300 space-y-3"></div>
      <div class="flex justify-end pt-2">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS DE DATOS Y LÓGICA -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
